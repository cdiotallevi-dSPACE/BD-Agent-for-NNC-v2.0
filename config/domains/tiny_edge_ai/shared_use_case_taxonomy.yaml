config_id: tiny_edge_ai_shared_use_case_taxonomy
config_version: 1.12.0
schema_version: 1.0.0
status: active

# Core terms are executed as bounded atomic searches by every discovery channel.
# Extended terms are matched locally in titles, snippets, HTML, PDFs and patent
# metadata/full text. Context terms support assessment but do not establish
# relevance without company attribution and neural/ML evidence.
generic_neural_terms:
  core_discovery_terms: [neural network, artificial neural network, deep neural network, transfer learning]
  extended_matching_terms: [ANN, DNN, CNN, recurrent neural network, RNN, LSTM, trained neural model]
  patent_cpc_codes: [G06N3/02, G06N3/04, G06N3/044, G06N3/0464, G06N20/00]

channel_policy:
  fast_iteration_core_terms_per_family: 2
  standard_core_terms_per_family: 3
  execute_extended_terms_via_web: false
  apply_extended_terms_locally: true
  apply_context_terms_during_assessment: true

# These are public-facing OEM application phrases. They improve discovery
# priority but never establish neural adoption or NNC applicability alone.
public_oem_application_vocabulary:
  - battery state estimation
  - motor thermal management
  - vehicle perception
  - driver monitoring
  - predictive diagnostics
  - software-defined vehicle
  - intelligent battery management
  - sensorless estimation
  - AI-enabled vehicle control

use_case_families:
  electric_machine_thermal_state_estimation:
