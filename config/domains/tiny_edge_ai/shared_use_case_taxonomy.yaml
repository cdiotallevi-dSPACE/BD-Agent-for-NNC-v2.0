    industries: [automotive, transportation, industrial, energy]
    core_discovery_terms: [motor thermal management, motor temperature estimation, rotor temperature estimation]
    extended_matching_terms: [electric motor temperature, rotor temperature, stator temperature, stator temperature estimation, motor thermal estimation, thermal state estimation, sensorless motor temperature, neural temperature estimator, recurrent ANN temperature]
    context_terms: [phase current, motor speed, coolant temperature, stator, rotor, torque control, real-time temperature, dedicated temperature sensor]
    patent_cpc_codes: [B60L3/0061, B60L2240/425]

