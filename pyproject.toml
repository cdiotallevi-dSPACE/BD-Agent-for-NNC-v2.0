[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bd-agent-for-nnc-v2"
version = "2.0.0"
description = "BDA for NNC v2.0 - evidence-driven Tiny-AI and Edge-AI business development assessment"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12", "chromadb>=0.5", "httpx>=0.27", "jsonschema>=4.22",
  "ddgs>=9", "ollama>=0.5", "openpyxl>=3.1", "pydantic>=2.7", "pymupdf>=1.24", "pypdf>=4.2", "PyYAML>=6.0",
  "python-dotenv>=1.0", "reportlab>=4.2", "typer>=0.12"
]
[project.optional-dependencies]
vector = ["llama-index>=0.11"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
[project.scripts]
bda = "bd_agent_neural_net_coder.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/bd_agent_neural_net_coder"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
